[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 256

# Used by GitHub Actions (FOUNDRY_PROFILE=ci): more fuzz runs.
[profile.ci.fuzz]
runs = 5000

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
